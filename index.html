<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心动周期模拟系统</title>
    <script src="https://cdn.staticfile.net/aframe/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.staticfile.net/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial'; }
        
        /* 强制全屏容器，解决手机显示不全的问题 */
        #main-ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: grid; grid-template-columns: 1fr 350px; /* 左边3D，右边压力图 */
            z-index: 10; pointer-events: none;
        }

        #pressure-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px; pointer-events: auto;
            border-left: 2px solid #333;
        }

        #controls {
            position: absolute; bottom: 20px; left: 20px;
            pointer-events: auto; display: flex; gap: 10px;
        }

        button { padding: 15px 25px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="main-ui">
        <div id="ar-view"></div>
        <div id="pressure-panel">
            <h3>心动周期模拟系统</h3>
            <canvas id="pressureChart"></canvas>
            <p id="status-text">系统就绪</p>
        </div>
    </div>

    <div id="controls">
        <button onclick="startSystole()">心室收缩</button>
        <button onclick="startDiastole()">舒张心室</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam;" renderer="antialias: true">
        <a-entity camera look-controls></a-entity>
        
        <a-entity id="heart-group" position="0 0 -3">
            <a-sphere id="ventricle" radius="0.5" color="yellow"></a-sphere>
            <a-text value="心脏模型" position="0 0.8 0" align="center"></a-text>
        </a-entity>
    </a-scene>

    <script>
        // 核心图表逻辑：在同一个画布内实时绘制压力变化
        const ctx = document.getElementById('pressureChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(20).fill(''),
                datasets: [
                    { label: '心室压', data: Array(20).fill(5), borderColor: 'red' },
                    { label: '主动脉压', data: Array(20).fill(80), borderColor: 'blue' }
                ]
            },
            options: { responsive: true, scales: { y: { min: 0, max: 120 } } }
        });

        // 手机适配逻辑：监测横竖屏
        window.addEventListener("orientationchange", () => {
            location.reload(); // 强制刷新以重绘 UI
        });

        function startSystole() {
            // 逻辑处理：变色、粒子发射
            document.getElementById('ventricle').setAttribute('color', 'red');
            document.getElementById('status-text').innerText = "当前状态：收缩射血期";
            // ... 后续逻辑
        }
    </script>
</body>
</html>
